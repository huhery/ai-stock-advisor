server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:81.69.42.239}:3306/ai_stock?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:AiStock2026!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:81.69.42.239}
    port: 6379

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

advisor:
  data-service-url: http://localhost:8001
  llm:
    api-key: ${LLM_API_KEY:your-api-key}
    base-url: ${LLM_BASE_URL:https://integrate.api.nvidia.com/v1}
    model: ${LLM_MODEL:meta/llama-3.1-70b-instruct}
